name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            family: windows
            os: windows-latest
            package_script: package:dir:win:x64
            dist_script: dist:win
            artifact: stella-windows-x64
            manifest: SHA256SUMS-windows-x64.txt
          - label: macOS Apple Silicon
            family: mac
            os: macos-latest
            package_script: package:dir:mac:arm64
            dist_script: dist:mac:arm64
            artifact: stella-macos-arm64
            manifest: SHA256SUMS-macos-arm64.txt
          - label: macOS Intel
            family: mac
            os: macos-15-intel
            package_script: package:dir:mac:x64
            dist_script: dist:mac:x64
            artifact: stella-macos-x64
            manifest: SHA256SUMS-macos-x64.txt

    runs-on: ${{ matrix.os }}
    env:
      STELLA_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      STELLA_REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.family == 'mac' && '1' || '0' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full source quality gate
        run: npm run check

      - name: Build and run native GUI interaction gate
        run: npm run build && npm run test:e2e:native

      - name: Package native unpacked application
        run: npm run ${{ matrix.package_script }}
        env:
          CSC_LINK: ${{ matrix.family == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.family == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.family == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.family == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.family == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      - name: Verify bundled Pi and capability-safe shell
        run: npm run test:packaged

      - name: Build distributables
        run: npm run ${{ matrix.dist_script }}
        env:
          CSC_LINK: ${{ matrix.family == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.family == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.family == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.family == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.family == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      - name: Generate SHA-256 manifest
        run: npm run release:checksums
        env:
          STELLA_CHECKSUM_MANIFEST: ${{ matrix.manifest }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS*.txt

  android:
    name: Android Companion
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install desktop and Companion dependencies
        run: |
          npm ci
          npm ci --prefix apps/companion

      - name: Run shared and Companion quality gates
        run: |
          npm run check
          npm run companion:test

      - name: Build debug APK
        run: npm run companion:apk:debug

      - name: Prepare manual-run debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p android-ci
          cp apps/companion/android/app/build/outputs/apk/debug/app-debug.apk android-ci/Stella-Companion-0.5.0-android-debug-vc6.apk
          sha256sum android-ci/Stella-Companion-0.5.0-android-debug-vc6.apk > android-ci/SHA256SUMS-android-debug.txt

      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stella-release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STELLA_ANDROID_KEYSTORE: ${{ runner.temp }}/stella-release.jks
          STELLA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STELLA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STELLA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STELLA_ANDROID_VERSION_CODE: "6"
        run: npm run companion:apk:release

      - name: Upload Android debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: stella-android-debug
          if-no-files-found: error
          path: android-ci/*

      - name: Upload signed Android artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: stella-android-release
          if-no-files-found: error
          path: |
            release/*.apk
            release/SHA256SUMS-android.txt

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes --verify-tag
